spring.application.name=campus-poll-system
server.port=8080

# Database Configuration with Environment Variable Support
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_poll_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456789}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:CampusPollSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHS256Security2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
